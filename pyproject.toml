[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pat-assess"
version = "0.3.0"
description = "PAT — Project Assessment Toolkit: capability, upkeep burden, and goal tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "packaging>=24,<27"]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["project-assessment", "static-analysis", "maintainability", "mcp"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "pytest-cov>=6,<8", "coverage>=7.6,<8", "ruff>=0.12,<1"]
mcp = ["mcp>=2.3,<3"]
test-value = ["coverage>=7.6,<8"]
vulture = ["vulture>=2.14,<3"]
analysis = [
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.scripts]
pat = "project_assess.cli:main"
project-assess = "project_assess.cli:main"
doc-value = "project_assess.doc_value.audit:main"
doc-value-nav = "project_assess.doc_value.navigation:main"
test-value = "project_assess.test_value.audit:main"
test-value-js = "project_assess.test_value.collectors:main"

[project.urls]
Repository = "https://github.com/gburch/project-assessment-toolkit"
Documentation = "https://github.com/gburch/project-assessment-toolkit/blob/main/docs/PROJECT_ASSESS.md"
Issues = "https://github.com/gburch/project-assessment-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/project_assess"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills" = "project_assess/.agents/skills"
"docs/PROJECT_ASSESS.md" = "project_assess/docs/PROJECT_ASSESS.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
